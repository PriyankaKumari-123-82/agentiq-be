[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
packages = ["ai_agent"]

[project]
name = "ai_agent"
version = "0.1.0"
description = "AI Agent application"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
dependencies = [
    "alembic>=1.14.1",
    "boto3>=1.40.35",
    "celery>=5.3.0",
    "cryptography>=42.0.0",
    "fastapi[standard]>=0.115.6,<0.116.0",
    "httpx>=0.27.0",
    "langchain>=0.3.0,<0.4.0",
    "langchain-community>=0.3.0,<0.4.0",
    "langchain-huggingface>=0.3.0,<0.4.0",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langgraph>=0.2.0",
    "langfuse>=2.0.0",
    "llama-index>=0.12.0",
    "llama-index-vector-stores-milvus>=0.4.0",
    "llama-index-embeddings-openai>=0.3.0",
    "llama-index-llms-openai>=0.3.0",
    "llama-index-postprocessor-cohere-rerank>=0.3.0",
    "litellm>=1.59.0",
    "minio>=7.2.9,<7.3.0",
    "numpy>=1.26.0",
    "openai>=2.0.0",  # Requires Responses API support (released March 2025)
    "tavily-python>=0.5.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
    "presidio-analyzer>=2.2.0",
    "psycopg2-binary>=2.9.10",
    "pypandoc>=1.13.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "pydantic-settings>=2.7.0",
    "pydantic>=2.10.3",
    "pymilvus>=2.6.0,<2.7.0",
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.3.0",
    "redis>=5.0.0",
    "requests>=2.32.3",
    "sentence-transformers>=3.0.1,<3.1.0",
    "sqlmodel>=0.0.22",
    "torch>=2.3.1,<2.4.0",
    "uvicorn[standard]>=0.29.0",
    "weasyprint>=60.0",
    "mcp>=1.0.0,<2.0.0",
    "sqlglot>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "black",
    "isort",
    "mypy",
]
charts = [
    "matplotlib>=3.7.0",
    "plotly>=5.18.0",
    "altair>=5.2.0",
    "kaleido>=0.2.0",  # For plotly static image export
]
images = [
    "Pillow>=10.0.0",
    "openai[dalle]",  # For DALL-E image generation
]
all = [
    "matplotlib>=3.7.0",
    "plotly>=5.18.0",
    "altair>=5.2.0",
    "kaleido>=0.2.0",
    "Pillow>=10.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["ai_agent/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["ai_agent/services/faq_service", "ai_agent/api/v1/agent"]
omit = ["ai_agent/tests/*"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = false
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[project.scripts]
ai-agent = "ai_agent.main:main"  # Adjust this to your main entry point if different
